[tool.ruff]
line-length = 160
target-version = "py313"
exclude = ["venv", "utils_old.py"]

[tool.ruff.lint]
select = ["F", "E"]
# Temporarily ignore common issues while we stabilize; we'll tighten later
ignore = [
  "F401",  # unused imports (allowed in scripts/tests)
  "F541",  # f-string without placeholders (used for formatting newlines)
  "F841",  # local variable assigned but never used (scripts)
  "E501",  # line too long
]
